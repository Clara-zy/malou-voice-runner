const hash = (i) => { const s = Math.sin(i * 127.1) * 43758.5453; return s - Math.floor(s); };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const aabb = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

/* 画布上下文：各渲染函数共用 */
const cvs = $('game'), ctx = cvs.getContext('2d');

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

<script>
'use strict';

/**
 * 声音输入：只读音量（RMS），不做语音识别 —— 这是整个项目技术上最简单也最稳的部分。
 * 现场嘈杂环境靠两件事兜底：开局 1.6s 校准噪音底 + 灵敏度滑杆。
 */
class VoiceInput {
  constructor() {
    this.active = false;
    this.level = 0;        // 平滑后的音量 0..~0.6
    this.floor = 0.004;    // 环境噪音底（校准得到）
    this.shoutPeak = 0;    // 玩家最大喊声（试喊校准得到；0 = 未校准）
    this.sens = 1.0;       // 灵敏度：>1 更容易触发
  }

  // 「跳」的音量门槛：得真喊；喊得越响跳得越高（力度按超出量计算）
  // 校准过：45% 嗓门起跳，封顶 75%——任何灵敏度档位下阈值都必然低于玩家实测峰值，
  // 杜绝"校准成功却整局跳不起来"的死区；下限兜住环境音（×2），避免欢呼声误触发。
  get Tjump() {
    if (this.shoutPeak > 0) {
      return clamp(this.shoutPeak * 0.45, Math.max(this.floor * 2, this.shoutPeak * 0.25), this.shoutPeak * 0.75) / this.sens;
    }
    return Math.max(0.17, this.floor * 3) / this.sens;
  }

  async start() {
    // 幂等：重复开麦直接复用（Safari 对同页 AudioContext 数量有硬限制，不能每次重开）
    if (this.active) { await this.ctx.resume(); return; }
    this.stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        // 回声消除开着：大屏音箱的声音进了麦克风也不至于误触发跳跃
        echoCancellation: true,
        // 关掉降噪和自动增益，保留真实音量曲线，阈值才稳定
        noiseSuppression: false,
        autoGainControl: false,
      },
    });
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    await this.ctx.resume(); // 必须在用户点击手势里调用
    this.source = this.ctx.createMediaStreamSource(this.stream);
    this.analyser = this.ctx.createAnalyser();
    this.analyser.fftSize = 1024;
    this.source.connect(this.analyser); // 注意：不连 destination，避免啸叫
    this.buf = new Float32Array(this.analyser.fftSize);
    this.bytes = new Uint8Array(this.analyser.fftSize);
    this.active = true;
  }

  // 彻底释放麦克风与音频上下文（超时兜底 / Esc 打断时调用，不留挂起的流）
  stop() {
    if (this.stream) this.stream.getTracks().forEach((t) => t.stop());
    if (this.ctx) { try { this.ctx.close(); } catch (e) {} }
    this.active = false;
    this.level = 0;
    this.ctx = null;
    this.stream = null;
    this.analyser = null;
  }

  // 开局校准：静默采样 1.6s，取 70 分位当噪音底
  // setTimeout 兜底：标签页失焦 rAF 停转时流程也能照常结束，不会卡死在 calib
  calibrate(ms = 1600) {
    return new Promise((resolve) => {
      const samples = [];
      const t0 = performance.now();
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        samples.sort((a, b) => a - b);
        this.floor = Math.max(0.002, samples[Math.floor(samples.length * 0.7)] || 0.004);
        resolve(this.floor);
      };
      const tick = () => {
        if (done) return;
        const raw = this.readRaw();
        if (raw != null) samples.push(raw);
        if (performance.now() - t0 < ms) requestAnimationFrame(tick);
        else finish();
      };
      tick();
      setTimeout(finish, ms + 600);
    });
  }

  // 试喊校准：记录窗口内平滑音量的峰值，作为这个玩家的"满嗓门"基线
  calibrateShout(ms = 1500) {
    return new Promise((resolve) => {
      let peak = 0;
      const t0 = performance.now();
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        this.shoutPeak = peak;
        resolve(peak);
      };
      const tick = () => {
        if (done) return;
        this.update();
        if (this.level > peak) peak = this.level;
        if (performance.now() - t0 < ms) requestAnimationFrame(tick);
        else finish();
      };
      tick();
      setTimeout(finish, ms + 600);
    });
  }

  readRaw() {
    if (!this.active) return null;
    // Safari 14.1+ 才有 getFloatTimeDomainData，做个降级
    if (this.analyser.getFloatTimeDomainData) {
      this.analyser.getFloatTimeDomainData(this.buf);
      let sum = 0;
      for (let i = 0; i < this.buf.length; i++) sum += this.buf[i] * this.buf[i];
      return Math.sqrt(sum / this.buf.length);
    }
    this.analyser.getByteTimeDomainData(this.bytes);
    let sum = 0;
    for (let i = 0; i < this.bytes.length; i++) {
      const v = (this.bytes[i] - 128) / 128;
      sum += v * v;
    }
    return Math.sqrt(sum / this.bytes.length);
  }

  // 每帧调用：快起慢落的平滑，喊声要跟手，安静要稳
  update() {
    const raw = this.readRaw();
    if (raw == null) return this.level;
    this.level = raw > this.level
      ? raw * 0.55 + this.level * 0.45
      : raw * 0.12 + this.level * 0.88;
    return this.level;
  }
}

</script>
<script>
'use strict';

/* ================= 音效（WebAudio 现场合成，无音频文件） ================= */
const SFX = {
  ctx: null,
  ensure() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  beep(freq, dur, type = 'square', vol = 0.07, slide = 0) {
    if (muted || !this.ctx) return;
    const t0 = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(this.ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  },
  jump() { this.beep(300, 0.16, 'square', 0.06, 500); },
  land() { this.beep(150, 0.05, 'triangle', 0.045); },
  die() { this.beep(220, 0.5, 'sawtooth', 0.08, -160); },
  tick() { this.beep(880, 0.06, 'square', 0.045); },
  go() { this.beep(1320, 0.2, 'square', 0.06); },
  win() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.beep(f, 0.16, 'triangle', 0.07), i * 130)); },
  pickup() { this.beep(988, 0.09, 'triangle', 0.06); setTimeout(() => this.beep(1319, 0.12, 'triangle', 0.06), 70); },
  destroy() { this.beep(180, 0.3, 'sawtooth', 0.09, -120); this.beep(90, 0.25, 'square', 0.08, -40); },
  mad() { [330, 392, 494, 587, 698].forEach((f, i) => setTimeout(() => this.beep(f, 0.1, 'square', 0.06), i * 60)); },
};

/* ================= BGM：WebAudio 合成的 8 小节循环（低音+节奏镲+旋律） =================
 * Music.rate 由游戏进度/发疯状态动态调整，跑得越快音乐越嗨。 */
const Music = {
  playing: false, step: 0, nextT: 0, timer: null, rate: 1, BPM: 132,
  bass: [36, 36, 43, 43, 45, 45, 41, 43],                                  // 每小节根音
  lead: [60, 64, 67, 64, 72, 67, 64, 60, 65, 69, 72, 69, 64, 60, 62, 64], // 每 4 步一个旋律音
  f(n) { return 440 * Math.pow(2, (n - 69) / 12); },
  start() {
    SFX.ensure();
    if (!SFX.ctx) return;
    this.playing = true; this.step = 0;
    this.nextT = SFX.ctx.currentTime + 0.1;
    if (this.timer) clearInterval(this.timer);
    this.timer = setInterval(() => this.schedule(), 60);
  },
  stop() {
    this.playing = false;
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
  },
  schedule() {
    if (!this.playing || !SFX.ctx) return;
    // 后台节流/上下文挂起恢复后，不补排落下的音符（否则切回标签页瞬间齐鸣）
    this.nextT = Math.max(this.nextT, SFX.ctx.currentTime + 0.05);
    if (muted) return;
    const spb = 60 / this.BPM / 2 / this.rate; // 八分音符时长，rate 越大节奏越快
    while (this.nextT < SFX.ctx.currentTime + 0.18) {
      const t = this.nextT, s = this.step;
      const bar = Math.floor(s / 8) % 8;
      this.note(this.f(this.bass[bar]), t, spb * 0.9, 'square', 0.042);
      this.note(6500 + Math.random() * 500, t, 0.03, 'square', 0.011);
      if (s % 4 === 0) this.note(this.f(this.lead[(s / 4) % 16]), t, spb * 1.6, 'triangle', 0.032);
      this.step++;
      this.nextT += spb;
    }
  },
  note(freq, t, dur, type, vol) {
    const ctx = SFX.ctx;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
};

</script>
<script>
'use strict';

/* ================= 障碍与生成 ================= */
const BLOCKERS = [
  { e: '📄', label: '需求变更', color: '#c98a1b' },
  { e: '🚧', label: '404', color: '#7a68c9' },
  { e: '💣', label: 'P0 故障', color: '#c93a3f' },
];

function spawnOne(x, prog) {
  const r = Math.random();
  let type;
  if (prog < 0.06) type = 'bug';
  else if (prog > 0.28 && r < 0.2) type = 'paper';
  else if (prog > 0.2 && r < 0.42) type = 'pit';
  else type = r < 0.72 ? 'bug' : 'blocker';

  if (type === 'bug') {
    obstacles.push({ type, x, w: 56, h: 56, e: '🐛', label: 'NullPointerException', color: '#c93a3f' });
  } else if (type === 'blocker') {
    const b = BLOCKERS[Math.floor(Math.random() * BLOCKERS.length)];
    obstacles.push({ type, x, w: 64, h: 92, e: b.e, label: b.label, color: b.color });
  } else if (type === 'paper') {
    obstacles.push({ type, x, w: 84, h: 64, top: 392 + Math.random() * 26, e: '✈️', label: '需求变更变更', color: '#b8860b' });
  } else {
    obstacles.push({ type: 'pit', x, w: 110 + Math.random() * 40 + prog * DIFF.PIT_PROG });
  }
}

/* 道具生成：放在两障碍之间的空档。咖啡低空（小跳可得），奶茶高空（满力跳） */
function spawnPickup(x) {
  if (Math.random() > PICK.CHANCE) return;
  const boba = Math.random() < PICK.BOBA_CHANCE;
  // 咖啡 470–500：贴着跑过头顶拿不到，必须小跳；奶茶 330–370：几乎要满力跳
  pickups.push({
    type: boba ? 'boba' : 'coffee',
    x, y: boba ? 330 + Math.random() * 40 : 470 + Math.random() * 30,
    w: 44, h: 44, taken: false,
  });
}

function fillObstacles() {
  while (spawnX < camX + W + 500) {
    if (spawnX > GOAL_DIST - 500) { spawnX = camX + W + 600; break; } // 终点前留一段净土
    spawnOne(spawnX, spawnX / GOAL_DIST);
    const gap = 260 + 300 * (0.9 + Math.random() * 0.9) + (spawnX / GOAL_DIST) * DIFF.GAP_PROG;
    spawnX += gap;
    spawnPickup(spawnX - gap * 0.5 + Math.random() * 60); // 空档中部偏后一点
  }
}

</script>
<script>
'use strict';

/* ================= 游戏状态 ================= */
const voice = new VoiceInput();
let mode = 'menu';            // menu | calib | ready | play | over
let muted = false;

const player = { x: PLAYER_X, y: GROUND, vy: 0, grounded: true };
let dist = 0, camX = 0, speed = 0, tNow = 0, lastVol = 0;
let obstacles = [], spawnX = 1000;
let countdown = 0, goFlash = 0;
let deadInfo = null, winInfo = false, shake = 0;
let jumpCd = 0, jumpBuf = 0, keyJump = false, spaceHeld = false, spaceHoldT = 0;
let touchHeld = false, touchHoldT = 0, touchId = null;
let shoutT = 0, shoutVol = 0; // 松手后的喊声包络：持续一小段时间，期间可给发疯值充电
let pendingScore = 0, saved = false;

/* 计分与连躲 */
let lineBase = 0, bonusPts = 0, combo = 0, maxCombo = 0;
/* 发疯值 */
let madness = 0, berserkT = 0, madCd = 0, madFrozen = false, madFlash = 0, madCount = 0, sprintDone = false;
/* 道具与粒子 */
let pickups = [], particles = [], floaties = [];

const curScore = () => Math.min(SCORE.CAP, Math.floor(lineBase) + bonusPts);

/* 速度：难度曲线 300→380 + 终点冲刺 + 发疯加成 */
function speedFor() {
  const prog = clamp(dist / GOAL_DIST, 0, 1);
  let v = AUTO_V_START + (AUTO_V_END - AUTO_V_START) * prog;
  if (prog >= SPRINT_FROM) v += SPRINT_BONUS;
  if (berserkT > 0) v *= MAD.SPEED_MUL;
  return v;
}

/* 粒子与浮动文字 */
function spawnBurst(x, y, colors, n, spd = 260, g = 900) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = spd * (0.4 + Math.random() * 0.8);
    particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, g,
      life: 0.5 + Math.random() * 0.4, max: 0.9, size: 3 + Math.random() * 4,

}

}
function updateParticles(dt) {

  for (const f of floaties) { f.life -= dt; f.y += f.vy * dt; }
  floaties = floaties.filter((f) => f.life > 0);
}

/* 躲过障碍：连躲计分 */

  let pts = SCORE.DODGE_BASE + Math.min(combo, SCORE.COMBO_CAP) * SCORE.DODGE_PER_COMBO;
  if (o.type === 'paper') {
    pts *= SCORE.PLANE_MULT;

  if (combo >= 2 && combo % 5 === 0) textPop(player.x, GROUND - 300, `连躲 x${combo}! 🔥`, '#ffd34d', 26);
}

function playerBox(inset) {
  return { x: player.x - PLAYER_W / 2 + inset, y: player.y - PLAYER_H + inset, w: PLAYER_W - inset * 2, h: PLAYER_H - inset * 2 };
}
function obBox(o, inset) {
  const y = o.type === 'paper' ? o.top : GROUND - o.h;

}

  for (const o of obstacles) {
    if (o.type === 'pit' && player.x > o.x + 12 && player.x < o.x + o.w - 12) return true;
  }

/* ================= 输入 ================= */
addEventListener('keydown', (e) => {
  const k = e.key;

/* 触摸/鼠标：按住画布蓄力，松开起跳（与空格同一套蓄力模型，手机可玩） */

addEventListener('pointercancel', endTouch);
stageEl.addEventListener('contextmenu', (e) => e.preventDefault()); // 长按别弹菜单

/* 喊声包络：蓄得越久喊得越响（chargeVol）、也喊得越久（发疯值按时间充电）
 * 最短按 0.06s 兜底：亚帧极速轻点也至少是一次小跳，不会完全不跳 */
function triggerShout(t) {
  t = Math.max(t, 0.06);
  shoutVol = chargeVol(t);
  shoutT = 0.15 + t * 1.2;
}

function currentVol(dt) {
  if (DEMO) return demoVol(dt);
  let v = voice.active ? voice.update() : 0;
  if (shoutT > 0) v = Math.max(v, shoutVol * clamp(shoutT / 0.2, 0, 1)); // 尾段 0.2s 线性收音
  return v;
}

/* 演示模式：一个简单的自动玩 AI，也用来验证全套机制 */
let demoPulse = 0;
function nearestHazard() {
  let best = null;
  for (const o of obstacles) {
    const nd = o.x - (player.x + 26);
    if (nd > -30 && (!best || nd < best.nd)) best = { o, nd };
  }

}
function demoVol(dt) {
  demoPulse = Math.max(0, demoPulse - dt);
  if (demoPulse > 0) return 0.3;
  const n = nearestHazard();
  if (n && player.grounded) {
    if (n.o.type === 'paper') return 0;                            // 纸飞机：闭嘴
    // 触发距离按当前速度等比缩放：提速后提前量也要加大
    const sc = speed / AUTO_V_START;
    const trig = (n.o.type === 'bug' ? 80 : n.o.type === 'blocker' ? 100 : 30) * sc;
    if (n.nd <= trig) { demoPulse = 0.09; return 0.3; }            // 喊一嗓子
  }
  return 0;                                                         // 平时安静
}

/* ================= 流程 ================= */
function resetRun() {
  dist = 0; camX = 0; speed = 0; lastVol = 0;
  obstacles = []; spawnX = 1000; pickups = [];
  particles = []; floaties = [];
  player.x = PLAYER_X;
  player.y = GROUND; player.vy = 0; player.grounded = true;

  $('screen-over').classList.add('hidden');

}

function die(o) {

  window.__lastDeath = { label: o.label || o.type, dist: Math.round(dist), speed: Math.round(speed), px: Math.round(player.x), py: Math.round(player.y), vy: Math.round(player.vy), ox: Math.round(o.x || 0), ow: Math.round(o.w || 0), vol: +lastVol.toFixed(3) };
  spawnBurst(player.x, player.y - 40, ['#ff6b6b', '#ffb020', '#ffffff'], 20, 340);
  textPop(player.x, player.y - 140, '💥', '#ff6b6b', 44);
  navigator.vibrate && navigator.vibrate([120, 60, 160]);
  SFX.die();
  setTimeout(showOver, 800);
}

function winRun() {
  if (deadInfo || winInfo) return;
  winInfo = true;
  dist = GOAL_DIST;
  SFX.win();
  setTimeout(showOver, 900);
}

const DEATHS = {
  'NullPointerException': ['💀', '吗喽已卒', '你被 NullPointerException 当场砸中：引用指着一指，就指到了天堂。', '小技巧：小障碍小声喊就够，不用吼那么用力。'],
  '需求变更': ['📄', '吗喽裂开', '需求又双叒叕变了，吗喽被拍进了变更单里。', '小技巧：落地站稳再起跳，别贪连跳。'],
  '404': ['🚧', '此路不通', '404 Not Found：需求文档里的这条路，现实中不存在。', '小技巧：提前一点喊，跳得更高更远。'],
  'P0 故障': ['💣', '本迭代结束', 'P0 告警：全群都在 @你，包括老板。', '小技巧：提前一点喊，跳得更高更远。'],
  '需求变更变更': ['✈️', '低空遇袭', '纸飞机（第 N 版需求变更）从头顶飞过——谁让你在它下面乱喊的？', '小技巧：看到纸飞机就闭嘴快走，千万别跳。'],

}

/* ================= 跳跃 ================= */
function handleJump(vol, dt) {
  jumpCd = Math.max(0, jumpCd - dt);
  jumpBuf = Math.max(0, jumpBuf - dt);
  let want = 0;
  if (keyJump) { want = 1; keyJump = false; } // ↑ 等效满力度喊声
  else if (vol > voice.Tjump) want = clamp((vol - voice.Tjump) / 0.12, 0, 1); // 喊得越响跳得越高
  if (want > 0 && jumpCd <= 0) {
    jumpCd = 0.3;
    if (player.grounded && countdown <= 0) {
      player.vy = -(JUMP_V_MIN + (JUMP_V_MAX - JUMP_V_MIN) * want);
      player.grounded = false;
      jumpBuf = 0;
      spawnBurst(player.x, GROUND - 6, ['#cdd8ff', '#8fa0d8'], 6, 140, 600);
      SFX.jump();
    } else {
      jumpBuf = 0.12; // 落地前 0.12s 内的喊声会被缓存，落地立刻起跳
    }
  }
  if (jumpBuf > 0 && player.grounded && countdown <= 0) {
    player.vy = -JUMP_V_MIN;
    player.grounded = false;
    jumpBuf = 0;
    spawnBurst(player.x, GROUND - 6, ['#cdd8ff', '#8fa0d8'], 6, 140, 600);
    SFX.jump();
  }
}

/* ================= 主逻辑 ================= */
function step(dt) {
  shake = Math.max(0, shake - dt * 1.4);
  goFlash = Math.max(0, goFlash - dt);
  madFlash = Math.max(0, madFlash - dt);
  if (deadInfo || winInfo) return; // 定格画面，等结算面板

  if (countdown > 0) {
    const prev = Math.ceil(countdown);
    countdown -= dt;
    const now = Math.ceil(countdown);
    if (now !== prev && now > 0) SFX.tick();
    if (countdown <= 0) { goFlash = 0.7; SFX.go(); }
    return;
  }

  spaceHoldT = spaceHeld ? spaceHoldT + dt : 0;
  touchHoldT = touchHeld ? touchHoldT + dt : 0;
  shoutT = Math.max(0, shoutT - dt);
  const vol = currentVol(dt);
  lastVol = vol;
  // 蓄力时音量条同步上升（还没到喊出来的程度）
  const holdT = spaceHeld ? spaceHoldT : touchHeld ? touchHoldT : 0;
  if (holdT > 0) lastVol = Math.max(lastVol, voice.Tjump * 1.6 * Math.min(1, holdT / CHARGE_FULL_T));
  handleJump(vol, dt);

  // ===== 发疯值：喊=充电，安静=衰减，纸飞机靠近=冻结（闭嘴区规则） =====
  madFrozen = obstacles.some((o) => o.type === 'paper' && Math.abs(o.x + o.w / 2 - player.x) < MAD.FREEZE_DIST);
  if (madCd > 0) madCd -= dt;
  if (berserkT > 0) {
    berserkT -= dt;
    if (berserkT <= 0) { madness = 0; madCd = MAD.COOLDOWN; }
  } else if (madCd <= 0) {
    if (!madFrozen) {
      if (vol >= voice.Tjump) madness = Math.min(100, madness + MAD.RATE * dt);
      else madness = Math.max(0, madness - MAD.DECAY * dt);
    }
    if (madness >= 100) {
      berserkT = MAD.BERSERK_T; madCount++; madFlash = 1.2;
      textPop(player.x, GROUND - 290, '😤 发疯写码!!', '#ff6b6b', 30);
      navigator.vibrate && navigator.vibrate(80);
      SFX.mad();
    }
  }

  // ===== 前进：难度曲线 + 冲刺段 + 发疯加成；发疯期间写码双倍 =====
  speed = speedFor();
  dist += speed * dt;
  lineBase += (speed * dt / SCORE.PX_PER_LINE) * (berserkT > 0 ? MAD.SCORE_MUL : 1);
  camX = dist;
  player.x = PLAYER_X + dist; // 玩家世界坐标前进，屏幕位置保持固定
  const prog = dist / GOAL_DIST;
  if (!sprintDone && prog >= SPRINT_FROM) {
    sprintDone = true;
    textPop(player.x, GROUND - 300, '🚀 上线冲刺!', '#6be08a', 28);
  }
  Music.rate = 1 + 0.15 * clamp(prog, 0, 1) + (berserkT > 0 ? 0.25 : 0) + (sprintDone ? 0.1 : 0);

  // ===== 竖直物理 =====
  player.vy += GRAVITY * dt;
  player.y += player.vy * dt;
  const overPit = isOverPit();
  if (!overPit && player.y >= GROUND && player.vy >= 0) {
    if (!player.grounded && player.vy > 400) {
      SFX.land();
      spawnBurst(player.x, GROUND - 4, ['#cdd8ff', '#8fa0d8', '#5a7bc9'], 9, 170, 700);
    }
    player.y = GROUND;
    player.vy = 0;
    player.grounded = true;
  } else {
    player.grounded = false;
  }
  if (player.y - PLAYER_H > H + 80) { die({ type: 'pit' }); return; }

  // ===== 障碍推进 + 碰撞（发疯状态可捶爆地面障碍，纸飞机/深坑依然致命） =====
  fillObstacles();
  for (const o of obstacles) {
    if (o.type === 'paper') o.x -= 130 * dt;
    if (o.dead || o.type === 'pit') continue;
    if (aabb(playerBox(10), obBox(o, 8))) {
      if (berserkT > 0 && o.type !== 'paper') {
        o.dead = true;
        bonusPts += SCORE.DESTROY;
        spawnBurst(o.x + o.w / 2, GROUND - o.h / 2, ['#ff6b6b', '#ffb020', '#ffffff'], 18, 320);
        textPop(o.x, GROUND - o.h - 40, `👊 捶爆! +${SCORE.DESTROY}`, '#ff9a3d', 22);
        shake = Math.max(shake, 0.25);
        SFX.destroy();
      } else { die(o); return; }
    }
  }

  // ===== 连躲计分：障碍（或纸飞机）被甩到身后即算躲过 =====
  for (const o of obstacles) {
    if (!o.counted && !o.dead) {
      const behind = o.type === 'paper' ? o.x + o.w < player.x - 40 : o.x + o.w < player.x - PLAYER_W / 2 - 6;
      if (behind) { o.counted = true; addDodge(o); }
    }
  }
  obstacles = obstacles.filter((o) => !o.dead && o.x + (o.w || 0) > camX - 240);

  // ===== 道具收集 =====
  for (const p of pickups) {
    if (!p.taken && aabb(playerBox(4), { x: p.x - 22, y: p.y - 22, w: 44, h: 44 })) {
      p.taken = true;
      const pts = p.type === 'boba' ? PICK.BOBA_PTS : PICK.COFFEE_PTS;
      bonusPts += pts;
      spawnBurst(p.x, p.y, ['#ffd34d', '#fff1b8'], 10, 200, 500);
      textPop(p.x, p.y - 24, `+${pts}行`, '#ffd34d');
      SFX.pickup();
    }
  }
  pickups = pickups.filter((p) => !p.taken && p.x > camX - 200);

  updateParticles(dt);
  if (dist >= GOAL_DIST) winRun();
}

<script>

}

function drawClouds() {
  const par = 0.12, tile = 340;

  ctx.font = '54px ' + EMOJI_FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i = Math.floor(off / tile) - 1; i * tile - off < W + 240; i++) {
    ctx.globalAlpha = 0.5;
    ctx.fillText('☁️', i * tile - off + hash(i) * 120, 80 + hash(i * 3 + 7) * 140);
  }
  ctx.globalAlpha = 1;
}

function drawBuildings() {
  const par = 0.3, tile = 230;
  const off = camX * par;
  for (let i = Math.floor(off / tile) - 1; i * tile - off < W + 40; i++) {
    const bx = i * tile - off;
    const bh = 120 + hash(i * 7 + 1) * 190;
    const bw = 130 + hash(i * 11 + 2) * 70;
    const by = GROUND - bh;
    ctx.fillStyle = '#141f3d';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = '#0e1730';
    ctx.fillRect(bx + bw * 0.4, by - 26, 8, 26);
    for (let wy = by + 18; wy < GROUND - 24; wy += 30) {

}

function drawGround() {
  const pits = obstacles.filter((o) => o.type === 'pit');
  let segs = [[camX - 60, camX + W + 60]];
  for (const p of pits) {
    const out = [];
    for (const [a, b] of segs) {
      if (p.x > b || p.x + p.w < a) { out.push([a, b]); continue; }
      if (p.x > a) out.push([a, p.x]);

    ctx.fillStyle = '#3f7a4a';

function drawObstacles() {
  for (const o of obstacles) {

function drawPickups() {
  for (const p of pickups) {
    if (p.taken) continue;

    if (sx > W + 80 || sx < -80) continue;
    const y = p.y + Math.sin(tNow * 3 + p.x * 0.02) * 6;
    // 光晕
    const g = ctx.createRadialGradient(sx, y, 4, sx, y, 30);
    g.addColorStop(0, p.type === 'boba' ? 'rgba(255,170,220,.35)' : 'rgba(255,211,77,.35)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(sx, y, 30, 0, 7);
    ctx.fill();
    ctx.font = '34px ' + EMOJI_FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.type === 'boba' ? '🧋' : '☕', sx, y);
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x - camX, p.y, p.size, 0, 7);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const f of floaties) {
    ctx.globalAlpha = clamp(f.life / f.max, 0, 1);
    ctx.font = `800 ${f.size}px system-ui`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = f.color;
    ctx.strokeStyle = 'rgba(5,8,18,.7)';
    ctx.lineWidth = 4;
    ctx.strokeText(f.str, f.x - camX, f.y);
    ctx.fillText(f.str, f.x - camX, f.y);
  }
  ctx.globalAlpha = 1;
}

function drawBerserkVignette() {
  const a = 0.10 + 0.05 * Math.sin(tNow * 10);
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.85);
  g.addColorStop(0, 'rgba(255,40,40,0)');
  g.addColorStop(1, `rgba(255,40,40,${a})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawMadFlash() {
  const a = clamp(madFlash / 1.2, 0, 1);
  ctx.globalAlpha = a;
  bigCenter('😤 发疯写码!!', '#ff6b6b');
  ctx.globalAlpha = 1;
}

function drawGoal() {
  const sx = GOAL_DIST - camX;
  if (sx < -100 || sx > W + 200) return;
  ctx.strokeStyle = 'rgba(255,255,255,.55)';
  ctx.lineWidth = 3;
  ctx.setLineDash([14, 12]);
  ctx.beginPath();
  ctx.moveTo(sx, 140);
  ctx.lineTo(sx, GROUND);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = '46px ' + EMOJI_FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('🏁', sx, GROUND - 56);
  ctx.font = '700 18px system-ui';
  ctx.fillStyle = '#ffe9a8';
  ctx.fillText('成功上线', sx, GROUND - 76);
}

function drawPlayer() {
  const sx = player.x - camX;
  const airH = GROUND - player.y;

  ctx.fillStyle = 'rgba(0,0,0,.35)';
  const sh = clamp(1 - airH / 260, 0.25, 1);
  ctx.beginPath();
  ctx.ellipse(sx, GROUND + 8, 30 * sh, 7 * sh, 0, 0, 7);
  ctx.fill();

  if (speed > 280 && !deadInfo) {
    ctx.strokeStyle = 'rgba(255,255,255,.35)';
    ctx.lineWidth = 3;
    for (let i = 0; i < 3; i++) {
      const ly = player.y - 58 + i * 22;
      const len = 34 + hash(Math.floor(tNow * 14) + i) * 26;
      ctx.beginPath();
      ctx.moveTo(sx - 52, ly);
      ctx.lineTo(sx - 52 - len, ly);
      ctx.stroke();
    }
  }

  if (berserkT > 0 && !deadInfo) {
    // 发疯光环
    const a = 0.25 + 0.12 * Math.sin(tNow * 12);
    ctx.fillStyle = `rgba(255,140,40,${a})`;
    ctx.beginPath();
    ctx.arc(sx, player.y - 38, 52 + Math.sin(tNow * 12) * 4, 0, 7);
    ctx.fill();
  }

  const shouting = lastVol > voice.Tjump;
  const face = deadInfo ? '💀' : winInfo ? '🥳' : berserkT > 0 ? '🤬' : shouting ? '😡' : '🐵';
  ctx.font = '62px ' + EMOJI_FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(face, sx, player.y - 8);

  // 蓄力进度弧：空格/手指按住时显示，满圈=满嗓门
  const holdT = spaceHeld ? spaceHoldT : touchHeld ? touchHoldT : 0;
  if (holdT > 0 && !deadInfo && !winInfo) {
    const cy = player.y - PLAYER_H - 24;
    ctx.lineWidth = 6;
    ctx.strokeStyle = 'rgba(255,255,255,.25)';
    ctx.beginPath();
    ctx.arc(sx, cy, 15, 0, Math.PI * 2);
    ctx.stroke();
    const frac = Math.min(1, holdT / CHARGE_FULL_T);
    ctx.strokeStyle = frac >= 1 ? '#ff6b6b' : '#ffd34d';
    ctx.beginPath();
    ctx.arc(sx, cy, 15, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac);
    ctx.stroke();
  }
}

function hudPill(x, y, text, size, color) {
  ctx.font = `700 ${size}px system-ui`;
  const w = ctx.measureText(text).width + 34;
  ctx.fillStyle = 'rgba(10,16,34,.75)';
  rr(x, y, w, 46, 12);
  ctx.fill();
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x + w / 2, y + 24);
}

function drawVolMeter(x, y, w, h) {
  const maxV = voice.Tjump * 1.7;
  ctx.fillStyle = 'rgba(10,16,34,.75)';
  rr(x - 8, y - 6, w + 16, h + 30, 12);
  ctx.fill();
  const jx = w / 1.7;
  ctx.fillStyle = 'rgba(255,255,255,.10)';
  rr(x, y, w, h, 7);
  ctx.fill();
  ctx.fillStyle = 'rgba(229,72,77,.32)';
  ctx.fillRect(x + jx, y, w - jx, h);
  const fw = w * clamp(lastVol / maxV, 0, 1);
  ctx.fillStyle = lastVol >= voice.Tjump ? '#ff6b6b' : 'rgba(255,255,255,.6)';
  rr(x, y, Math.max(fw, 4), h, 7);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.fillRect(x + jx - 1, y - 3, 2, h + 6);
  ctx.font = '600 13px system-ui';
  ctx.fillStyle = 'rgba(220,230,255,.7)';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('🎤 音量', x, y + h + 18);
  ctx.textAlign = 'right';
  ctx.fillText('🦘 跳（越响越高）', x + w, y + h + 18);
}

function drawHUD() {
  hudPill(24, 20, `📋 ${curScore()} 行代码`, 22, '#ffd34d');
  if (combo >= 2) hudPill(24, 74, `🔥 连躲 x${combo}`, 18, '#ff9a3d');

  const px = 330, pw = 440, py = 32, ph = 16;
  ctx.fillStyle = 'rgba(10,16,34,.75)';
  rr(px - 6, py - 6, pw + 12, ph + 12, 12);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.14)';
  rr(px, py, pw, ph, 8);
  ctx.fill();
  const pr = clamp(dist / GOAL_DIST, 0, 1);
  if (pr > 0) {
    ctx.fillStyle = '#58c16b';
    rr(px, py, Math.max(10, pw * pr), ph, 8);
    ctx.fill();
  }
  ctx.font = '16px ' + EMOJI_FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🐵', px + pw * pr, py + ph / 2);
  ctx.fillText('🏁', px + pw + 16, py + ph / 2);
  ctx.font = '600 15px system-ui';
  ctx.fillStyle = '#cdd8ff';
  ctx.fillText(`上线进度 ${Math.floor(pr * 100)}%`, px + pw / 2, py + ph + 20);

  drawVolMeter(W - 324, 20, 300, 26);
  drawMadMeter(W - 324, 66, 300, 14);

  ctx.font = '500 14px system-ui';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'rgba(220,230,255,.55)';
  const hint = DEMO ? '演示模式：吗喽自动玩' : '😱 大喊起跳（越响越高） · 空格/长按屏幕蓄力';
  ctx.fillText(hint + ' · F 全屏 · M 音效' + (muted ? ' 🔇' : ''), W - 24, H - 22);
}

/* 发疯值条：喊=充电；纸飞机靠近显示"闭嘴区"冻结；满了进入发疯写码 */
function drawMadMeter(x, y, w, h) {
  ctx.fillStyle = 'rgba(10,16,34,.75)';
  rr(x - 8, y - 4, w + 16, h + 24, 10);
  ctx.fill();
  if (berserkT > 0) {
    // 发疯中：整条闪烁红
    const a = 0.55 + 0.35 * Math.sin(tNow * 12);
    ctx.fillStyle = `rgba(255,80,80,${a})`;
    rr(x, y, w * clamp(berserkT / MAD.BERSERK_T, 0, 1), h, 6);
    ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(255,255,255,.08)';
    rr(x, y, w, h, 6);
    ctx.fill();
    if (madness > 0) {
      const g = ctx.createLinearGradient(x, 0, x + w, 0);
      g.addColorStop(0, '#a06bff');
      g.addColorStop(1, '#ff5c5c');
      ctx.fillStyle = g;
      rr(x, y, w * madness / 100, h, 6);
      ctx.fill();
    }
  }
  ctx.font = '600 13px system-ui';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'rgba(220,230,255,.7)';
  ctx.fillText(berserkT > 0 ? '😤 发疯写码中!!' : '😤 发疯值（持续大喊充电）', x, y + h + 14);
  if (madFrozen && berserkT <= 0) {
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffd34d';
    ctx.fillText('🤐 闭嘴区（需求变更接近）', x + w, y + h + 14);
  }
}

function bigCenter(text, color) {
  ctx.fillStyle = 'rgba(5,8,18,.5)';
  ctx.fillRect(0, H / 2 - 90, W, 180);
  ctx.font = '900 110px system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  ctx.fillText(text, W / 2, H / 2);
}
function drawCountdown() {
  const n = Math.ceil(countdown);
  if (n > 0) bigCenter(String(n), '#ffd34d');
}
function drawGo() {
  bigCenter('上号！🚀', '#6be08a');
}

</script>
<script>
'use strict';

/* ================= DOM 界面：排行榜、麦克风流程、缩放 ================= */

/* 缩放适配：保持 1280×720 逻辑分辨率等比铺满窗口 */
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  $('stage').style.transform = `scale(${s})`;
}
addEventListener('resize', fit);
fit();

/* 排行榜（本机 localStorage，够大屏单机场景用） */
let lastEntryTs = 0;

function loadLB() {
  try { return JSON.parse(localStorage.getItem(LB_KEY)) || []; } catch (e) { return []; }
}
function addScore(name, score) {
  const lb = loadLB();
  const entry = { name, score, ts: Date.now() };
  lb.push(entry);
  lb.sort((a, b) => b.score - a.score);
  try { localStorage.setItem(LB_KEY, JSON.stringify(lb.slice(0, 10))); } catch (e) {}
  return { ts: entry.ts, rank: lb.indexOf(entry) };
}
function lbHTML(list, meTs) {
  const top = list.slice(0, 5);
  if (!top.length) return '<p class="lb-empty">还没有吗喽上榜，等你来当第一个 🐵</p>';
  const medals = ['🥇', '🥈', '🥉'];
  return '<ol class="lb">' + top.map((e, i) =>
    `<li class="${e.ts === meTs ? 'me' : ''}"><span class="rk">${medals[i] || i + 1}</span><span class="nm">${esc(e.name)}</span><span class="sc">${e.score} 行</span></li>`
  ).join('') + '</ol>';
}
function lbRefreshStart() {
  $('lb-start').innerHTML = lbHTML(loadLB(), lastEntryTs);
}

function showOver() {
  if (mode !== 'play') return;
  mode = 'over';
  Music.stop();
  pendingScore = curScore();
  const stats = [];
  if (maxCombo >= 2) stats.push(`最高连躲 x${maxCombo}`);
  if (madCount > 0) stats.push(`发疯 ${madCount} 次`);
  const statsStr = stats.length ? `（${stats.join(' · ')}）` : '';
  if (winInfo) {
    $('over-emoji').textContent = '🎉';
    $('over-title').textContent = '上线成功！';
    $('over-msg').textContent = `本次发布 ${pendingScore} 行代码 · 0 回滚 · 建议全组喝奶茶庆祝`;
    $('over-tip').textContent = '';
  } else {
    const [em, ti, ms, tp] = DEATHS[deathKey(deadInfo)] || DEATHS.pit;
    $('over-emoji').textContent = em;
    $('over-title').textContent = ti;
    $('over-msg').textContent = ms;
    $('over-tip').textContent = tp;
  }
  $('over-score').textContent = `本次成绩：${pendingScore} 行代码${statsStr}`;
  try { $('name-input').value = localStorage.getItem(NAME_KEY) || ('吗喽' + (10 + Math.floor(Math.random() * 90))); } catch (e) {}
  saved = false;
  $('btn-save').disabled = false;
  $('btn-save').textContent = '上排行榜';
  $('over-save').classList.toggle('hidden', DEMO);
  $('lb-over').innerHTML = lbHTML(loadLB(), lastEntryTs);
  $('screen-over').classList.remove('hidden');
  if (!DEMO) $('name-input').focus();
  if (DEMO) setTimeout(() => { if (mode === 'over') resetRun(); }, 4000);
}

function doSave() {
  if (saved) return -1;
  const name = $('name-input').value.trim() || '匿名吗喽';
  try { localStorage.setItem(NAME_KEY, name); } catch (e) {}
  const { ts, rank } = addScore(name, pendingScore);
  lastEntryTs = ts; // 复用同一次写入的时间戳，榜单高亮不会因跨毫秒偶发失效
  saved = true;
  $('btn-save').disabled = true;
  $('btn-save').textContent = '已上榜 ✓';
  $('lb-over').innerHTML = lbHTML(loadLB(), lastEntryTs);
  $('name-input').blur(); // 让 Enter 重开不再被输入框拦下
  return rank;
}
$('btn-save').addEventListener('click', doSave);
$('name-input').addEventListener('keydown', (e) => { e.stopPropagation(); if (e.key === 'Enter') doSave(); });
$('btn-retry').addEventListener('click', () => { if (mode === 'over') resetRun(); });

/* ================= 麦克风流程 ================= */
let micFlow = 0; // 流程令牌：Esc 打断/回菜单后，旧流程在下一个 await 点自动作废

// 回到菜单时复位开麦控件，让「手感不对 → Esc → 重新校准」成为完整闭环
function resetMicUI() {
  micFlow++;
  const btn = $('btn-mic');
  btn.disabled = false;
  btn.textContent = '🎤 开麦上班';
  $('meter-box').classList.add('hidden');
  $('calib-tip').classList.add('hidden');
  $('mic-error').classList.add('hidden');
}

async function startMic() {
  SFX.ensure();
  const btn = $('btn-mic');
  if (btn.disabled) return;
  const myFlow = ++micFlow;
  btn.disabled = true;
  btn.textContent = '🎤 正在开启麦克风…';
  $('mic-error').classList.add('hidden');
  try {
    // 权限弹窗被忽略时会一直挂起，8 秒无响应就提示去看弹窗
    let late = false;
    await Promise.race([
      voice.start().then(() => { if (late) voice.stop(); }), // 超时后才成功：迟到的流立即关掉，不留挂起的麦克风
      sleep(8000).then(() => { late = true; throw new Error('8 秒内没有响应——请检查浏览器顶部的麦克风权限弹窗'); }),
    ]);
  } catch (err) {
    const why = err && err.name === 'NotAllowedError'
      ? '麦克风权限被拒绝：请在地址栏允许麦克风后刷新页面'
      : (err && err.message) || '未知错误';
    $('mic-error').textContent = '麦克风开启失败：' + why + '。可先用键盘模式试玩。';
    $('mic-error').classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = '🎤 开麦上班';
    return;
  }
  if (myFlow !== micFlow) return;
  btn.textContent = '🎤 麦克风已就绪';
  $('meter-box').classList.remove('hidden');
  $('calib-tip').classList.remove('hidden');
  mode = 'calib';
  $('calib-tip').textContent = '🤫 请保持安静，正在测量环境噪音…';
  await voice.calibrate(1600);
  if (myFlow !== micFlow) return;
  // 试喊校准：按玩家自己的嗓门定起跳线，比全局阈值可靠得多
  $('calib-tip').textContent = '👉 现在用你最大的声音——喊一嗓子！（测量你的嗓门基线）';
  const peak = await voice.calibrateShout(1500);
  if (myFlow !== micFlow) return;
  // 有效性直接对照最终起跳线（含 clamp/噪音底/灵敏度），和 Tjump 公式天然闭环
  if (peak > voice.Tjump * 1.15) {
    $('calib-tip').textContent = '✅ 起跳线已按你的嗓门校准！试着冲进红区就会起跳，马上开始…';
  } else {
    voice.shoutPeak = 0; // 喊声没明显高于环境音，退回默认阈值
    $('calib-tip').textContent = '🤔 没太听到你喊？先用默认灵敏度开局，手感不对按 Esc 回来把灵敏度调高再试';
  }
  mode = 'ready';
  await sleep(2600);
  if (myFlow !== micFlow) return;
  resetRun();
}
$('btn-mic').addEventListener('click', startMic);

$('btn-keyboard').addEventListener('click', () => {
  SFX.ensure();
  resetRun(); // 不开麦，直接用空格模拟喊声
});

$('sens').addEventListener('input', (e) => {
  voice.sens = parseFloat(e.target.value);
  $('sens-val').textContent = voice.sens.toFixed(1);
});

function updateMeterDOM() {
  if (!voice.active) return;
  const maxV = voice.Tjump * 1.7;
  $('meter-fill').style.width = clamp(voice.level / maxV * 100, 0, 100) + '%';
  $('mark-jump').style.left = (100 / 1.7) + '%';
}

</script>
<script>
'use strict';

/* ================= 对外接口（linx.js 语音助手把它们注册成 MCP 工具） =================
 * 自 main 合并移植：原实现在单文件 game.js 尾部，模块化后独立成桥接层。
 * goal 从赛程参数推导（?goal= 缩短赛程时语音播报的行数保持一致）。 */
window.Game = {
  get mode() { return mode; },
  status() {
    return {
      screen: mode, // menu 主页 | calib/ready 开麦校准中 | play 对局中 | over 结算
      score: mode === 'over' ? pendingScore : curScore(),
      goal: Math.floor(GOAL_DIST / SCORE.PX_PER_LINE),
      result: mode !== 'over' ? null : winInfo ? '上线成功' : (DEATHS[deathKey(deadInfo)] || DEATHS.pit)[1],
      sensitivity: voice.sens,
      sound: !muted,
      mic: voice.active,
      leaderboard: loadLB().slice(0, 5).map((e) => ({ name: e.name, score: e.score })),
    };
  },
  start() {
    if (mode === 'play') return '已经在对局中了';
    if (mode === 'calib' || mode === 'ready') return '正在开麦校准，马上自动开局';
    if (voice.active || DEMO) { resetRun(); return '开局倒计时开始'; }
    startMic();
    return '正在开麦：先安静 2 秒校准环境噪音，然后自动开局';
  },
  backToMenu() {
    if (mode !== 'over') return '只有结算界面才能回主页，当前界面：' + mode;
    toMenu();
    return '已回到主页';
  },
  setSensitivity(v) {
    v = clamp(Math.round(Number(v) * 10) / 10 || 1, 0.6, 1.8);
    voice.sens = v;
    $('sens').value = v;
    $('sens-val').textContent = v.toFixed(1);
    return `灵敏度已设为 ${v.toFixed(1)}`;
  },
  setSound(on) {
    muted = !on;
    return on ? '音效已打开' : '音效已关闭';
  },
  saveScore(name) {
    if (mode !== 'over' || DEMO) return '只有结算界面才能上排行榜';
    if (saved) return '本局成绩已经上过榜了';
    if (name) $('name-input').value = String(name).trim().slice(0, 8);
    const rank = doSave();
    return rank < 10 ? `已上榜，排第 ${rank + 1} 名，${pendingScore} 行代码` : `已记录，${pendingScore} 行代码，可惜没进前十`;
  },
};

</script>
<script>
'use strict';

/* ================= 主循环 & 启动 ================= */

// 收集页面运行时错误，供冒烟测试断言（正常游玩不受影响）
window.__errlog = [];
window.addEventListener('error', (e) => { window.__errlog.push(String(e.message)); });

let lastTs = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = clamp((ts - lastTs) / 1000, 0, 0.033);
  lastTs = ts;
  tNow = ts / 1000;
  if ((mode === 'menu' || mode === 'calib' || mode === 'ready') && voice.active) {
    voice.update();
    updateMeterDOM();
  }
  if (mode === 'play') step(dt);
  draw();
}
requestAnimationFrame(frame);

toMenu();
if (DEMO) resetRun(); // demo 走声控路径（demoVol），不启用键盘分支

// PWA：仅 http(s) 下注册（file:// 单文件版跳过）
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

</script>
<script>
'use strict';

/**
 * 灵矽（Linx）语音助手：浏览器扮演一台「设备」接入七牛灵矽 AI 平台，
 * 把游戏操作注册成端侧 MCP 工具，玩家说「开始游戏」「灵敏度调低点」就能驱动菜单。
 *
 * 只在主页 / 结算界面收音：对局中的吼叫不上传（ASR 往返太慢，跳跃仍走 audio.js 的音量判断）。
 * 协议文档：https://linx.qiniu.com/docs/xrobot/platform/websocket
 *           https://linx.qiniu.com/docs/xrobot/mcp/hardware-mcp
 */
const LINX_OTA = 'https://xrobo.qiniuapi.com/v1/ota/';
const LINX_CONSOLE = 'https://xrobo.qiniu.com/';
const LINX_RATE = 16000, LINX_FRAME = 320; // 上行 PCM16 单声道 20ms 一帧
// 服务端不做断句，要设备端自己判断一句话的起止（下面帧数都按 20ms 一帧算）
const LINX_VAD_MIN = 0.02;    // 开口音量下限（RMS），实际门槛 = max(下限, 噪音底 × 3)
const LINX_PREROLL = 15;      // 开口前补发 300ms，免得吞掉第一个字
const LINX_END_FRAMES = 35;   // 安静 700ms 算一句说完
const LINX_MAX_FRAMES = 400;  // 一句最长 8 秒，现场持续嘈杂也能收尾

// 麦克风采样率（通常 48k）→ 16k：按窗口取平均降采样，攒满一帧发给主线程
const LINX_WORKLET = `
class LinxPcm16k extends AudioWorkletProcessor {
  constructor() {
    super();
    this.ratio = sampleRate / ${LINX_RATE};
    this.pos = 0; this.acc = 0; this.cnt = 0;
    this.buf = new Int16Array(${LINX_FRAME}); this.n = 0;
  }
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (!ch) return true;
    for (let i = 0; i < ch.length; i++) {
      this.acc += ch[i]; this.cnt++; this.pos++;
      if (this.pos < this.ratio) continue;
      this.pos -= this.ratio;
      const s = Math.max(-1, Math.min(1, this.acc / this.cnt));
      this.acc = 0; this.cnt = 0;
      this.buf[this.n++] = s * 0x7fff;
      if (this.n === this.buf.length) {
        this.port.postMessage(this.buf.buffer, [this.buf.buffer]);
        this.buf = new Int16Array(${LINX_FRAME}); this.n = 0;
      }
    }
    return true;
  }
}
registerProcessor('linx-pcm16k', LinxPcm16k);
`;

function linxIdentity() {
  let id = localStorage.getItem('linx.deviceId');
  let cid = localStorage.getItem('linx.clientId');
  if (!id) {
    const b = crypto.getRandomValues(new Uint8Array(6));
    b[0] = (b[0] & 0xfe) | 0x02; // 本地管理的单播 MAC，不会和真实网卡撞号
    id = Array.from(b, (x) => x.toString(16).padStart(2, '0')).join(':').toUpperCase();
    localStorage.setItem('linx.deviceId', id);
  }
  if (!cid) {
    cid = crypto.randomUUID();
    localStorage.setItem('linx.clientId', cid);
  }
  return { id, cid };
}

class LinxClient {
  constructor(game) {
    this.game = game;
    this.gen = 0;          // 每次连接/断开 +1，用来作废还在路上的异步流程
    this.ws = null;
    this.ac = null;        // 收音和播放共用一个 AudioContext
    this.ready = false;    // hello 握手完成
    this.listening = false; // 正在上传一句话
    this.floor = 0.005;    // 环境噪音底（RMS），安静时自适应
    this.preroll = [];
    this.loud = 0;
    this.quiet = 0;
    this.uttFrames = 0;
    this.speaking = false; // 正在播 TTS：期间不上传音频，免得 AI 听见自己
    this.playAt = 0;
    this.sources = new Set();
    this.subTs = 0;
    this.tools = this.buildTools();
    setInterval(() => this.tick(), 200);
  }

  /* ---------- UI ---------- */
  setStatus(html, err) {
    const el = document.getElementById('linx-status');
    el.innerHTML = html;
    el.classList.toggle('err', !!err);
  }
  setButton(text) { document.getElementById('btn-linx').textContent = text; }
  subtitle(html) {
    document.getElementById('linx-sub').innerHTML = html;
    this.subTs = performance.now();
  }

  /* ---------- 连接流程：OTA 激活 → WebSocket 握手 → 开麦 ---------- */
  toggle() {
    if (this.ws || this.busy) this.disconnect('已断开');
    else this.connect();
  }

  async connect() {
    const gen = ++this.gen;
    this.busy = true;
    this.setButton('🗣️ 连接中…（点击取消）');
    try {
      if (!this.ac) this.ac = new (window.AudioContext || window.webkitAudioContext)();
      await this.ac.resume(); // 必须在点击手势里调用
      const cfg = await this.activate(gen);
      if (gen !== this.gen) return;
      this.setStatus('正在连接灵矽…');
      await this.openSocket(cfg, gen);
      if (gen !== this.gen) return;
      await this.startMic();
      if (gen !== this.gen) return;
      this.busy = false;
      this.setButton('🗣️ 断开灵矽');
      this.setStatus(`✅ 已连接：在主页或结算界面说「开始游戏」「灵敏度调低点」「帮我上榜，花名小王」试试<br>
        设备 ID <code>${linxIdentity().id}</code>（不是你的智能体在回答？到 <a href="${LINX_CONSOLE}" target="_blank" rel="noopener">智控台</a> → 设备管理 → 批量导入，填这个 MAC 后重连）`);
    } catch (e) {
      if (gen !== this.gen) return;
      this.disconnect('连接失败：' + (e && e.message || e), true);
    }
  }

  async ota() {
    const { id, cid } = linxIdentity();
    const res = await fetch(LINX_OTA, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Device-Id': id, 'Client-Id': cid, 'Activation-Version': '1' },
      body: JSON.stringify({
        uuid: cid,
        mac_address: id,
        application: { name: 'malou-voice-runner', version: '1.0.0', elf_sha256: '0'.repeat(64) },
        board: { type: 'malou-web', ssid: 'browser', rssi: 0 },
      }),
    });
    if (!res.ok) throw new Error(`OTA 请求失败（HTTP ${res.status}）`);
    const data = await res.json();
    if (data.error) throw new Error('OTA 返回错误：' + data.error);
    return data;
  }

  // 未绑定的设备会拿到 6 位激活码：在智控台绑定后轮询激活状态，再重新 OTA 拿 token
  async activate(gen) {
    this.setStatus('正在向灵矽上报设备…');
    for (;;) {
      const data = await this.ota();
      if (gen !== this.gen) return null;
      if (data.websocket && data.websocket.token) return data.websocket;
      if (!data.activation) throw new Error('OTA 没有返回连接信息');
      this.setStatus(`激活码 <b>${data.activation.code}</b>：打开 <a href="${LINX_CONSOLE}" target="_blank" rel="noopener">灵矽智控台</a> → 选择智能体 → 添加设备，填入激活码，绑定后自动连接…`);
      await this.waitBound(gen);
      if (gen !== this.gen) return null;
    }
  }

  async waitBound(gen) {
    const { id } = linxIdentity();
    while (gen === this.gen) {
      await new Promise((r) => setTimeout(r, 3000));
      try {
        const res = await fetch(LINX_OTA + 'activate', { method: 'POST', headers: { 'Device-Id': id } });
        if (res.status === 200 && (await res.text()).trim() === 'success') return;
      } catch (e) { /* 网络抖动，继续轮询 */ }
    }
  }

  // 浏览器 WebSocket 不能自定义请求头，鉴权参数改放到 URL query 里
  openSocket(cfg, gen) {
    const { id, cid } = linxIdentity();
    const url = new URL(cfg.url.replace(/^ws:/, 'wss:'));
    url.searchParams.set('device-id', id);
    url.searchParams.set('client-id', cid);
    url.searchParams.set('authorization', 'Bearer ' + cfg.token);
    url.searchParams.set('protocol-version', '1');

    return new Promise((resolve, reject) => {
      const ws = new WebSocket(url);
      ws.binaryType = 'arraybuffer';
      this.ws = ws;
      const timer = setTimeout(() => reject(new Error('10 秒内没有收到 hello 响应')), 10000);
      ws.onopen = () => ws.send(JSON.stringify({
        type: 'hello',
        version: 1,
        features: { mcp: true, notify: { config_updated: true } },
        transport: 'websocket',
        audio_params: {
          format: 'pcm', sample_rate: LINX_RATE, channels: 1, bit_depth: 16, endianness: 'little',
          frame_duration: 20, frame_size: LINX_FRAME, sample_format: 'signed_int16', play_buffer_duration: 1000,
        },
      }));
      ws.onmessage = (e) => {
        if (gen !== this.gen) return;
        if (typeof e.data !== 'string') { this.onAudio(e.data); return; }
        let msg;
        try { msg = JSON.parse(e.data); } catch (err) { return; }
        console.debug('[linx]', msg);
        if (msg.type === 'hello' && !this.ready) {
          clearTimeout(timer);
          this.onHello(msg);
          resolve();
        } else {
          this.onMessage(msg);
        }
      };
      ws.onclose = (e) => {
        clearTimeout(timer);
        reject(new Error(e.reason || `连接被关闭（${e.code}）`));
        if (gen === this.gen && this.ready) this.disconnect('灵矽连接已断开' + (e.reason ? '：' + e.reason : ''), true);
      };
    });
  }

  async startMic() {
    this.stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 },
    });
    if (!this.workletLoaded) {
      const url = URL.createObjectURL(new Blob([LINX_WORKLET], { type: 'application/javascript' }));
      await this.ac.audioWorklet.addModule(url);
      URL.revokeObjectURL(url);
      this.workletLoaded = true;
    }
    this.src = this.ac.createMediaStreamSource(this.stream);
    this.node = new AudioWorkletNode(this.ac, 'linx-pcm16k', { numberOfOutputs: 0 });
    this.node.port.onmessage = (e) => this.onFrame(e.data);
    this.src.connect(this.node);
  }

  /* ---------- 上行：按音量断句，一句话 = listen start → 音频帧 → 空帧 + listen stop ---------- */
  onFrame(buf) {
    const pcm = new Int16Array(buf);
    let sum = 0;
    for (let i = 0; i < pcm.length; i++) sum += pcm[i] * pcm[i];
    const rms = Math.sqrt(sum / pcm.length) / 0x8000;

    const open = this.ready && this.idle && !this.speaking && this.ws && this.ws.readyState === WebSocket.OPEN;
    if (!open) {
      if (this.listening) this.endUtterance();
      this.preroll.length = 0;
      this.loud = 0;
      return;
    }

    if (!this.listening) {
      this.floor = rms < this.floor * 3 ? this.floor * 0.95 + rms * 0.05 : this.floor * 0.999 + rms * 0.001;
      this.preroll.push(buf);
      if (this.preroll.length > LINX_PREROLL) this.preroll.shift();
      this.loud = rms > Math.max(LINX_VAD_MIN, this.floor * 3) ? this.loud + 1 : 0;
      if (this.loud >= 3) this.beginUtterance();
      return;
    }

    this.ws.send(buf);
    this.uttFrames++;
    this.quiet = rms > Math.max(LINX_VAD_MIN * 0.6, this.floor * 2) ? 0 : this.quiet + 1;
    if (this.quiet >= LINX_END_FRAMES || this.uttFrames >= LINX_MAX_FRAMES) this.endUtterance();
  }

  beginUtterance() {
    this.send({ session_id: this.sessionId, type: 'listen', state: 'start', mode: 'realtime' });
    this.listening = true;
    this.loud = 0;
    this.quiet = 0;
    this.uttFrames = 0;
    this.preroll.forEach((f) => this.ws.send(f));
    this.preroll = [];
    this.subtitle('<span class="me">🗣️ …</span>');
  }

  endUtterance() {
    this.listening = false;
    if (!this.ws || this.ws.readyState !== WebSocket.OPEN) return;
    this.ws.send(new Uint8Array(0));
    this.send({ session_id: this.sessionId, type: 'listen', state: 'stop', mode: 'realtime' });
  }

  disconnect(reason, err) {
    this.gen++;
    this.busy = false;
    this.ready = false;
    this.listening = false;
    this.speaking = false;
    this.preroll = [];
    this.loud = 0;
    clearTimeout(this.quietTimer);
    if (this.ws) { this.ws.onclose = null; this.ws.close(); this.ws = null; }
    if (this.src) { this.src.disconnect(); this.src = null; }
    if (this.node) { this.node.port.onmessage = null; this.node = null; }
    if (this.stream) { this.stream.getTracks().forEach((t) => t.stop()); this.stream = null; }
    if (this.decoder) { try { this.decoder.close(); } catch (e) {} this.decoder = null; }
    this.stopPlayback();
    this.setButton('🗣️ 连接灵矽语音助手');
    this.setStatus(reason || '', err);
  }

  /* ---------- 会话 ---------- */
  send(obj) {
    if (this.ws && this.ws.readyState === WebSocket.OPEN) this.ws.send(JSON.stringify(obj));
  }

  onHello(msg) {
    this.ready = true;
    this.sessionId = msg.session_id || '';
    const ap = msg.audio_params || {};
    this.down = { format: ap.format || 'opus', rate: ap.sample_rate || 24000, frameMs: ap.frame_duration || 60 };
    if (this.down.format === 'opus') this.setupOpus();
  }

  get idle() { return this.game.mode === 'menu' || this.game.mode === 'over'; }

  // 只有主页 / 结算界面才收音和说话（收音由 onFrame 判断）；开麦校准、对局期间打断 TTS，
  // 否则 AI 的声音会被校准当成环境噪音、对局中也会被当成喊声触发起跳
  tick() {
    if (!this.idle && this.speaking && !this.abortSent) {
      this.send({ session_id: this.sessionId, type: 'abort', reason: 'game_started' });
      this.abortSent = true;
      this.stopPlayback();
    }
    const sub = document.getElementById('linx-sub');
    const stale = performance.now() - this.subTs > 8000 && !this.speaking;
    sub.classList.toggle('hidden', !this.ready || stale || this.game.mode === 'play');
  }

  onMessage(msg) {
    switch (msg.type) {
      case 'stt':
        this.subtitle(`<span class="me">🗣️ ${linxEsc(msg.text)}</span>`);
        break;
      case 'llm':
        if (msg.text) this.emoji = msg.text;
        break;
      case 'tts':
        if (msg.state === 'start') {
          this.speaking = true;
          this.abortSent = false;
          clearTimeout(this.quietTimer);
        } else if (msg.state === 'sentence_start') {
          this.subtitle(`${this.emoji || '🐵'} ${linxEsc(msg.text)}`);
        } else if (msg.state === 'stop') {
          if (msg.is_aborted) this.stopPlayback();
          const left = this.ac ? Math.max(0, this.playAt - this.ac.currentTime) : 0;
          clearTimeout(this.quietTimer);
          this.quietTimer = setTimeout(() => { this.speaking = false; }, left * 1000 + 300);
        }
        break;
      case 'mcp':
        this.onMcp(msg.payload || {});
        break;
      case 'notify':
        if (msg.event === 'config_updated') {
          this.disconnect('智能体配置已更新，正在重连…');
          this.connect();
        }
        break;
    }
  }

  /* ---------- 下行音频：PCM 直接播；Opus 用 WebCodecs 解码 ---------- */
  setupOpus() {
    if (!('AudioDecoder' in window)) {
      this.setStatus('当前浏览器不支持 Opus 解码（WebCodecs），只能显示字幕，建议用 Chrome / Edge', true);
      return;
    }
    this.opusTs = 0;
    this.decoder = new AudioDecoder({
      output: (ad) => {
        const f = new Float32Array(ad.numberOfFrames);
        ad.copyTo(f, { planeIndex: 0, format: 'f32-planar' });
        this.enqueue(f, ad.sampleRate);
        ad.close();
      },
      error: (e) => console.warn('[linx] opus 解码失败', e),
    });
    this.decoder.configure({ codec: 'opus', sampleRate: this.down.rate, numberOfChannels: 1 });
  }

  onAudio(buf) {
    if (!this.down || !this.ac || !this.idle) return;
    if (this.down.format === 'pcm') {
      const pcm = new Int16Array(buf);
      const f = new Float32Array(pcm.length);
      for (let i = 0; i < pcm.length; i++) f[i] = pcm[i] / 0x8000;
      this.enqueue(f, this.down.rate);
    } else if (this.decoder && this.decoder.state === 'configured') {
      this.decoder.decode(new EncodedAudioChunk({ type: 'key', timestamp: this.opusTs, data: buf }));
      this.opusTs += this.down.frameMs * 1000;
    }
  }

  enqueue(samples, rate) {
    if (!samples.length) return;
    const buf = this.ac.createBuffer(1, samples.length, rate);
    buf.copyToChannel(samples, 0);
    const src = this.ac.createBufferSource();
    src.buffer = buf;
    src.connect(this.ac.destination);
    const t = Math.max(this.playAt, this.ac.currentTime + 0.06);
    src.start(t);
    this.playAt = t + buf.duration;
    this.sources.add(src);
    src.onended = () => this.sources.delete(src);
  }

  stopPlayback() {
    this.sources.forEach((s) => { try { s.stop(); } catch (e) {} });
    this.sources.clear();
    this.playAt = 0;
  }

  /* ---------- 端侧 MCP：把游戏操作暴露成工具 ---------- */
  buildTools() {
    const g = this.game;
    const none = { type: 'object', properties: {}, required: [] };
    return [
      {
        name: 'self.game.get_status',
        description: '获取吗喽声控跑酷的当前状态：screen 当前界面（menu 主页 / calib、ready 开麦校准中 / play 对局中 / over 结算）、本局成绩（行代码，满分 1000）、结局、灵敏度、音效开关、排行榜前五',
        inputSchema: none,
        run: () => g.status(),
      },
      {
        name: 'self.game.start',
        description: '开始一局吗喽声控跑酷。用户说「开始游戏」「开一局」「再来一局」时调用。首次会开麦并安静校准约 2 秒',
        inputSchema: none,
        run: () => g.start(),
      },
      {
        name: 'self.game.back_to_menu',
        description: '从结算界面回到游戏主页',
        inputSchema: none,
        run: () => g.backToMenu(),
      },
      {
        name: 'self.game.set_sensitivity',
        description: '设置喊声触发跳跃的灵敏度，越大越容易起跳；现场太吵、观众欢呼误触发时调低，喊了跳不起来时调高。调整前可先查询当前值',
        inputSchema: {
          type: 'object',
          properties: { value: { type: 'number', minimum: 0.6, maximum: 1.8, description: '灵敏度，范围 0.6~1.8，默认 1.0' } },
          required: ['value'],
        },
        run: (a) => g.setSensitivity(a.value),
      },
      {
        name: 'self.game.set_sound',
        description: '打开或关闭游戏音效',
        inputSchema: {
          type: 'object',
          properties: { on: { type: 'boolean', description: 'true 打开，false 关闭' } },
          required: ['on'],
        },
        run: (a) => g.setSound(!!a.on),
      },
      {
        name: 'self.game.save_score',
        description: '在结算界面把本局成绩登记到排行榜',
        inputSchema: {
          type: 'object',
          properties: { name: { type: 'string', description: '玩家花名或工号，最多 8 个字；不提供则用默认花名' } },
          required: [],
        },
        run: (a) => g.saveScore(a.name),
      },
    ];
  }

  onMcp(p) {
    const reply = (body) => this.send({ session_id: this.sessionId, type: 'mcp', payload: { jsonrpc: '2.0', id: p.id, ...body } });
    if (p.id === undefined || p.id === null) return; // notification，不需要回复

    if (p.method === 'initialize') {
      reply({
        result: {
          protocolVersion: (p.params && p.params.protocolVersion) || '2024-11-05',
          capabilities: { tools: {} },
          serverInfo: { name: '吗喽声控跑酷', version: '1.0.0' },
        },
      });
    } else if (p.method === 'tools/list') {
      reply({ result: { tools: this.tools.map(({ name, description, inputSchema }) => ({ name, description, type: 0, inputSchema })), nextCursor: null } });
    } else if (p.method === 'tools/call') {
      const { name, arguments: args } = p.params || {};
      const tool = this.tools.find((t) => t.name === name);
      if (!tool) { reply({ error: { code: -32601, message: '未知工具: ' + name } }); return; }
      try {
        const out = tool.run(args || {});
        const text = typeof out === 'string' ? out : JSON.stringify(out);
        reply({ result: { content: [{ type: 'text', text }], isError: false } });
      } catch (e) {
        reply({ result: { content: [{ type: 'text', text: '执行失败：' + (e && e.message || e) }], isError: true } });
      }
    } else {
      reply({ error: { code: -32601, message: '不支持的方法: ' + p.method } });
    }
  }
}

function linxEsc(s) {
  return String(s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

window.linx = new LinxClient(window.Game);
document.getElementById('btn-linx').addEventListener('click', () => window.linx.toggle());

</script>
</body>
</html>
